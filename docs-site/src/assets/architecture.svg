<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" role="img" aria-labelledby="arch-title arch-desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="arch-title">Nuclei architecture</title>
  <desc id="arch-desc">The Tauri shell spawns the Python kernel from a managed venv. The React frontend talks to the shell over Tauri IPC, to the kernel over a localhost WebSocket, and directly to api.anthropic.com for Dirac. The kernel routes circuits through framework adapters for simulation and through hardware providers to quantum clouds.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8093A8"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#00B4D8"/>
    </marker>
  </defs>

  <!-- Tauri shell -->
  <rect x="40" y="30" width="230" height="84" rx="10" fill="#8093A8" fill-opacity="0.07" stroke="#8093A8" stroke-width="1.5"/>
  <text x="155" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#8093A8">Tauri shell (Rust)</text>
  <text x="155" y="82" text-anchor="middle" font-size="11.5" fill="#8093A8">process mgmt · file I/O · IPC</text>
  <text x="155" y="98" text-anchor="middle" font-size="11.5" fill="#8093A8">auto-updater · menus</text>

  <!-- api.anthropic.com -->
  <rect x="650" y="30" width="230" height="84" rx="10" fill="#8093A8" fill-opacity="0.07" stroke="#8093A8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="765" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#8093A8">api.anthropic.com</text>
  <text x="765" y="82" text-anchor="middle" font-size="11.5" fill="#8093A8">Dirac AI — direct calls,</text>
  <text x="765" y="98" text-anchor="middle" font-size="11.5" fill="#8093A8">bring-your-own key</text>

  <!-- Frontend -->
  <rect x="40" y="250" width="270" height="170" rx="10" fill="#00B4D8" fill-opacity="0.06" stroke="#00B4D8" stroke-width="1.5"/>
  <text x="175" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#00B4D8">Frontend (React + TS)</text>
  <text x="175" y="310" text-anchor="middle" font-size="11.5" fill="#8093A8">Monaco editor · circuit diagram (D3)</text>
  <text x="175" y="328" text-anchor="middle" font-size="11.5" fill="#8093A8">Bloch sphere (Three.js) · histogram</text>
  <text x="175" y="346" text-anchor="middle" font-size="11.5" fill="#8093A8">Dirac chat panel · Zustand stores</text>
  <text x="175" y="372" text-anchor="middle" font-size="11.5" fill="#8093A8">desktop: Tauri WebView</text>
  <text x="175" y="390" text-anchor="middle" font-size="11.5" fill="#8093A8">web: same code on Pyodide</text>

  <!-- Kernel -->
  <rect x="480" y="250" width="330" height="170" rx="10" fill="#00B4D8" fill-opacity="0.06" stroke="#00B4D8" stroke-width="1.5"/>
  <text x="645" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#00B4D8">Python kernel</text>
  <text x="645" y="310" text-anchor="middle" font-size="11.5" fill="#8093A8">WebSocket server (localhost only)</text>
  <text x="645" y="328" text-anchor="middle" font-size="11.5" fill="#8093A8">per-connection Executor</text>
  <text x="645" y="346" text-anchor="middle" font-size="11.5" fill="#8093A8">shared HardwareManager + JobStore</text>
  <text x="645" y="372" text-anchor="middle" font-size="11.5" fill="#8093A8">parse → CircuitSnapshot</text>
  <text x="645" y="390" text-anchor="middle" font-size="11.5" fill="#8093A8">execute → SimulationResult</text>

  <!-- Shell <-> Frontend: Tauri IPC -->
  <line x1="150" y1="122" x2="150" y2="242" stroke="#8093A8" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="162" y="186" font-size="11.5" fill="#8093A8">Tauri IPC commands</text>

  <!-- Shell -> Kernel: spawn -->
  <path d="M 270 72 H 560 V 242" fill="none" stroke="#8093A8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="64" font-size="11.5" fill="#8093A8">spawns from managed venv</text>

  <!-- Frontend <-> Kernel: WebSocket -->
  <line x1="318" y1="335" x2="472" y2="335" stroke="#00B4D8" stroke-width="2" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
  <text x="395" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#00B4D8">WebSocket</text>
  <text x="395" y="356" text-anchor="middle" font-size="11" fill="#8093A8">ws://localhost:9742</text>

  <!-- Frontend -> Anthropic -->
  <path d="M 290 250 V 170 H 765 V 122" fill="none" stroke="#8093A8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="420" y="162" font-size="11.5" fill="#8093A8">HTTPS — only when an API key is set</text>

  <!-- Kernel -> adapters -->
  <path d="M 700 420 V 462" fill="none" stroke="#00B4D8" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="710" y="446" font-size="11.5" fill="#8093A8">adapters (simulation)</text>

  <!-- Adapter chips -->
  <g font-size="12.5" font-weight="600">
    <rect x="488" y="470" width="92" height="38" rx="8" fill="#00B4D8" fill-opacity="0.06" stroke="#00B4D8"/>
    <text x="534" y="494" text-anchor="middle" fill="#8093A8">Qiskit</text>
    <rect x="592" y="470" width="92" height="38" rx="8" fill="#00B4D8" fill-opacity="0.06" stroke="#00B4D8"/>
    <text x="638" y="494" text-anchor="middle" fill="#8093A8">Cirq</text>
    <rect x="696" y="470" width="92" height="38" rx="8" fill="#00B4D8" fill-opacity="0.06" stroke="#00B4D8"/>
    <text x="742" y="494" text-anchor="middle" fill="#8093A8">CUDA-Q</text>
    <rect x="800" y="470" width="92" height="38" rx="8" fill="#00B4D8" fill-opacity="0.06" stroke="#00B4D8"/>
    <text x="846" y="494" text-anchor="middle" fill="#8093A8">QDK (Q#)</text>
  </g>
  <text x="694" y="532" text-anchor="middle" font-size="11" fill="#8093A8">Aer · cirq.Simulator · CUDA-Q targets · QDK sparse sim</text>

  <!-- Kernel -> providers -> clouds -->
  <path d="M 520 420 V 489 H 392" fill="none" stroke="#8093A8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="446" font-size="11.5" fill="#8093A8" text-anchor="start">providers (hardware)</text>
  <rect x="60" y="462" width="330" height="56" rx="10" fill="#8093A8" fill-opacity="0.07" stroke="#8093A8" stroke-width="1.5"/>
  <text x="225" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#8093A8">Quantum clouds</text>
  <text x="225" y="506" text-anchor="middle" font-size="11.5" fill="#8093A8">IBM · IonQ · Quantinuum · Braket · Azure · NVIDIA</text>
</svg>
