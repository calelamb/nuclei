[package]
name = "qec-dem"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Fast Stim detector-error-model text parser for Nuclei's QEC detector graph, compiled to WASM."
license = "MIT"

[lib]
# `cdylib` for the wasm build; `rlib` so `cargo test` runs the parser natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Kept optional + behind a feature so `cargo test` (native) needs no wasm
# toolchain; only the wasm build pulls wasm-bindgen in.
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
