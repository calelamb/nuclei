name: Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web version
        run: npm run build:web

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 6 requires Node >= 22.12
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      # `astro build` runs starlight-links-validator (astro.config.mjs plugins),
      # so any broken internal link or anchor fails this job.
      - name: Build docs site (validates internal links)
        run: npm run build
        working-directory: docs-site

  macos-agent-isolation:
    name: macOS Agent Isolation
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Rust 1.77.2
        uses: dtolnay/rust-toolchain@1.77.2

      # This venv is an ephemeral qualification fixture. It is not the
      # hash-verified, app-bundled wheelhouse required for offline provisioning.
      - name: Create macOS qualification fixture
        shell: bash
        run: |
          set -euo pipefail
          environment_root="$RUNNER_TEMP/nuclei-agent-runtime"
          managed_root="$environment_root/managed"
          venv_root="$environment_root/venv"
          request_root="$RUNNER_TEMP/nuclei-agent-requests"
          sentinel_root="$RUNNER_TEMP/nuclei-agent-sentinels"
          export UV_PYTHON_INSTALL_DIR="$managed_root"
          mkdir -p "$environment_root"
          uv python install 3.12
          managed_python="$(uv python find --managed-python 3.12)"

          # The runtime identity rejects every symlink. Materialize the managed
          # standalone distribution so every executable/importable input is a
          # regular file beneath the one environment root.
          materialized_root="$environment_root/managed-materialized"
          cp -R -L "$managed_root" "$materialized_root"
          rm -rf "$managed_root"
          mv "$materialized_root" "$managed_root"
          managed_python="$(uv python find --managed-python 3.12)"

          "$managed_python" -m venv --copies "$venv_root"
          uv pip install --python "$venv_root/bin/python" --requirement kernel/agent-requirements.txt
          site_packages="$("$venv_root/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          mkdir -p "$request_root" "$sentinel_root/project" "$sentinel_root/home"
          printf '%s\n' 'project qualification sentinel' > "$sentinel_root/project/sentinel"
          printf '%s\n' 'home qualification sentinel' > "$sentinel_root/home/sentinel"

          NUCLEI_AGENT_ENVIRONMENT_ROOT="$environment_root" \
          NUCLEI_AGENT_SITE_PACKAGES="$site_packages" \
          "$venv_root/bin/python" - <<'PY'
          import os
          import sys
          import sysconfig
          from pathlib import Path

          root = Path(os.environ["NUCLEI_AGENT_ENVIRONMENT_ROOT"])
          assert root == root.resolve(strict=True)
          paths = {
              "base_prefix": Path(sys.base_prefix),
              "stdlib": Path(sysconfig.get_path("stdlib")),
              "executable": Path(sys.executable),
              "site_packages": Path(os.environ["NUCLEI_AGENT_SITE_PACKAGES"]),
          }
          for name, path in paths.items():
              canonical = path.resolve(strict=True)
              assert path == canonical, f"{name} is not canonical: {path} -> {canonical}"
              canonical.relative_to(root)
          for path in root.rglob("*"):
              assert not path.is_symlink(), f"runtime contains symlink: {path}"
          PY

          {
            echo "NUCLEI_AGENT_KERNEL_ROOT=$GITHUB_WORKSPACE/kernel"
            echo "NUCLEI_AGENT_ENVIRONMENT_ROOT=$environment_root"
            echo "NUCLEI_AGENT_PYTHON=$venv_root/bin/python"
            echo "NUCLEI_AGENT_SITE_PACKAGES=$site_packages"
            echo "NUCLEI_AGENT_REQUEST_TEMP_ROOT=$request_root"
            echo "NUCLEI_AGENT_PROJECT_SENTINEL=$sentinel_root/project/sentinel"
            echo "NUCLEI_AGENT_HOME_SENTINEL=$sentinel_root/home/sentinel"
          } >> "$GITHUB_ENV"

      - name: Require runtime-proven macOS isolation
        run: cargo test --test agent_runtime_boundary macos_required -- --nocapture
        working-directory: src-tauri
