[package]
name = "nuclei"
version = "0.5.1"
description = "A purpose-built desktop IDE for quantum computing"
authors = ["Cale Lamb"]
license = "MIT"
repository = "https://github.com/calelamb/nuclei"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tokio = { version = "1.52.3", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.20.0", features = ["v4"] }
sha2 = "0.10.9"
hex = "0.4.3"
fs2 = "0.4.3"

[target."cfg(unix)".dependencies]
libc = "0.2.186"

[target."cfg(target_os = \"macos\")".dependencies]
# security-framework 3.7 requires Rust 1.85; keep macOS compatible with rust-version 1.77.2.
security-framework = "=3.6.0"

[target."cfg(windows)".dependencies]
# zip 4.3+ requires Rust 1.82; keep the updater compatible with rust-version 1.77.2.
zip = { version = "=4.2.0", default-features = false }
# open 5.3.4+ uses std::path::absolute, which is unstable on Rust 1.77.2.
open = { version = "=5.3.3", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"
