[package]
name = "nuclei"
version = "0.13.0"
description = "A purpose-built desktop IDE for quantum computing"
authors = ["Cale Lamb"]
license = "MIT"
repository = "https://github.com/calelamb/nuclei"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
# Secure model gateway (Stage R2): rustls (not native-tls) so Linux CI needs no
# OpenSSL system lib; the blocking client keeps the gateway synchronous, matching
# the rest of the harness (no tokio in this crate).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# OS keychain access for the Anthropic API key: native keychains on
# macOS/Windows, pure-Rust Secret Service on Linux (compiles headless; only
# touches D-Bus at runtime).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Stage R3 workspace patch transactions: content hashing for conflict
# detection (`dirac::workspace`). Cross-language exactness with the TS
# FNV-1a hash is not required (the Rust side is desktop-authoritative), so a
# real digest is used instead of a hand-rolled one.
sha2 = "0.10"
hex = "0.4"
# Stage R7 hardware-submission transport: a blocking WebSocket client to the
# local Python kernel (ws://localhost:9742). `default-features = false` +
# `handshake` keeps the client synchronous and pulls NO TLS/OpenSSL — the
# kernel is plaintext localhost, and the rest of the harness has no tokio.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
# Process-group control for the execution supervisor (setsid + killpg).
libc = "0.2"

[dev-dependencies]
# Filesystem-backed workspace tests (Stage R3 `dirac::workspace::fs`).
tempfile = "3"
